<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca - SaturniumBrowser</title>

    <style>
        :root {
            --accent: var(--sb-accent, #7c5cff);
            --bg: var(--sb-content-bg, #070914);
            --card: #0e1222;
            --card-hover: #121830;
            --line: #1c2238;
            --text: #eef1ff;
            --title: #aebcff;
            --muted: #8189a3;
            --domain: #7fe0a8;
        }

        * { box-sizing: border-box; }

        html, body { margin: 0; height: 100%; }

        body {
            font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
            color: var(--text);
            overflow-y: auto;
            overflow-x: hidden;
            background:
                radial-gradient(900px 380px at 18% -80px,
                    color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%),
                var(--bg);
        }

        /* ---------- Cabeçalho fixo ---------- */

        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            padding: 14px clamp(20px, 6vw, 96px);
            background: color-mix(in srgb, var(--bg) 82%, transparent);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--line);
        }

        .topbar-inner {
            display: flex;
            align-items: center;
            gap: 22px;
        }

        .mark {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text);
            font-weight: 700;
            font-size: 17px;
            letter-spacing: .2px;
            text-decoration: none;
        }

        .mark-dot {
            width: 30px;
            height: 30px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), #d45cff);
            box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 45%, transparent);
            display: grid;
            place-items: center;
            font-size: 16px;
        }

        .search-form {
            flex: 1;
            max-width: 680px;
            display: flex;
            align-items: center;
            gap: 8px;
            height: 48px;
            padding: 0 6px 0 18px;
            border-radius: 24px;
            background: var(--card);
            border: 1px solid var(--line);
            transition: border-color .15s, box-shadow .15s;
        }

        .search-form:hover { border-color: #2b3354; }

        .search-form:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent);
        }

        .search-icon { color: var(--muted); font-size: 16px; }

        .search-form input {
            flex: 1;
            min-width: 0;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text);
            font: inherit;
            font-size: 15px;
        }

        .search-form input::placeholder { color: var(--muted); }

        .kbd {
            font-size: 11px;
            color: var(--muted);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 2px 7px;
        }

        .search-form:focus-within .kbd { display: none; }

        .search-form button {
            flex-shrink: 0;
            height: 36px;
            padding: 0 18px;
            border: none;
            border-radius: 18px;
            background: var(--accent);
            color: #fff;
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: filter .15s, transform .1s;
        }

        .search-form button:hover { filter: brightness(1.12); }
        .search-form button:active { transform: scale(.97); }

        /* ---------- Conteúdo ---------- */

        .main {
            padding: 20px clamp(20px, 6vw, 96px) 70px;
        }

        .column { max-width: 720px; }

        .meta-line {
            margin: 0 0 14px 4px;
            font-size: 13px;
            color: var(--muted);
            min-height: 18px;
        }

        .state-box {
            margin-top: 48px;
            padding: 36px 24px;
            border: 1px dashed var(--line);
            border-radius: 16px;
            color: var(--muted);
            font-size: 15px;
            text-align: center;
        }

        /* ---------- Resultado ---------- */

        .result {
            padding: 16px 18px;
            margin: 0 -18px 4px;
            border-radius: 16px;
            border: 1px solid transparent;
            transition: background .15s, border-color .15s;
            animation: rise .35s ease both;
            animation-delay: calc(var(--i, 0) * 40ms);
        }

        .result:hover {
            background: var(--card-hover);
            border-color: var(--line);
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: none; }
        }

        .result-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            min-width: 0;
        }

        .favicon {
            position: relative;
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            border-radius: 9px;
            background: #171d36;
            border: 1px solid var(--line);
            display: grid;
            place-items: center;
            font-size: 12px;
            font-weight: 700;
            color: var(--title);
            overflow: hidden;
            text-transform: uppercase;
        }

        .favicon img {
            position: absolute;
            inset: 5px;
            width: 16px;
            height: 16px;
            object-fit: contain;
            background: #171d36;
        }

        .site { min-width: 0; line-height: 1.25; }

        .site-name {
            font-size: 13px;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .site-path {
            font-size: 12px;
            color: var(--domain);
            opacity: .85;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge {
            flex-shrink: 0;
            margin-left: auto;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: #ffc266;
            border: 1px solid #5a4420;
            background: #2a2112;
            border-radius: 999px;
            padding: 3px 8px;
        }

        .result-title {
            display: block;
            font-size: 20px;
            line-height: 1.3;
            font-weight: 500;
            color: var(--title);
            text-decoration: none;
            margin-bottom: 6px;
        }

        .result-title:hover { color: #fff; text-decoration: underline; text-underline-offset: 3px; }

        .result-snippet {
            font-size: 14px;
            line-height: 1.6;
            color: #a9afc6;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* ---------- Carregando (skeleton) ---------- */

        .skeleton {
            padding: 16px 0;
        }

        .sk {
            height: 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            background: linear-gradient(90deg, #121830 25%, #1b2342 50%, #121830 75%);
            background-size: 200% 100%;
            animation: shimmer 1.3s infinite linear;
        }

        @keyframes shimmer {
            from { background-position: 200% 0; }
            to   { background-position: -200% 0; }
        }

        .footer-note {
            margin-top: 36px;
            font-size: 12px;
            color: #4b526a;
        }

        @media (max-width: 720px) {
            .mark span:last-child { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            .result, .sk { animation: none; }
        }

        /* ---------- Abas (Tudo, Modo IA, Imagens...) ---------- */

        .tabs {
            display: flex;
            gap: 4px;
            margin-top: 10px;
            padding-left: 52px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .tabs::-webkit-scrollbar { display: none; }

        .tab {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 9px 14px 10px;
            font-size: 14px;
            color: var(--muted);
            text-decoration: none;
            border-bottom: 3px solid transparent;
            transition: color .15s, border-color .15s;
        }

        .tab:hover { color: var(--text); }

        .tab.active {
            color: var(--text);
            border-bottom-color: var(--accent);
            font-weight: 600;
        }

        .tab.ai.active { border-bottom-color: #d45cff; }

        .tab .spark {
            background: linear-gradient(135deg, var(--accent), #d45cff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 700;
        }

        .column.wide { max-width: none; }

        /* ---------- Modo IA ---------- */

        .ai-card {
            max-width: 820px;
            padding: 22px 26px;
            border-radius: 20px;
            border: 1px solid var(--line);
            background:
                linear-gradient(135deg,
                    color-mix(in srgb, var(--accent) 12%, transparent),
                    color-mix(in srgb, #d45cff 8%, transparent)),
                var(--card);
            animation: rise .35s ease both;
        }

        .ai-label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
            font-size: 13px;
            font-weight: 700;
            color: var(--title);
        }

        .ai-text p { margin: 0 0 12px; line-height: 1.7; font-size: 15.5px; color: #dfe3f8; }
        .ai-text ul { margin: 0 0 12px; padding-left: 22px; line-height: 1.7; color: #dfe3f8; }
        .ai-text strong { color: #fff; }

        .cite {
            display: inline-block;
            min-width: 18px;
            padding: 0 5px;
            margin: 0 1px;
            border-radius: 9px;
            background: color-mix(in srgb, var(--accent) 30%, transparent);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            line-height: 18px;
            text-align: center;
            text-decoration: none;
            vertical-align: super;
        }

        .ai-model { margin-top: 6px; font-size: 12px; color: var(--muted); }

        .sources-title {
            max-width: 820px;
            margin: 26px 0 8px 4px;
            font-size: 13px;
            font-weight: 700;
            color: var(--muted);
            letter-spacing: .04em;
            text-transform: uppercase;
        }

        .src-num {
            flex-shrink: 0;
            width: 22px;
            height: 22px;
            border-radius: 7px;
            display: grid;
            place-items: center;
            font-size: 11px;
            font-weight: 700;
            background: color-mix(in srgb, var(--accent) 30%, transparent);
        }

        /* ---------- Imagens ---------- */

        .img-grid {
            columns: 5 190px;
            column-gap: 12px;
        }

        .img-card {
            break-inside: avoid;
            margin: 0 0 12px;
            border-radius: 12px;
            overflow: hidden;
            background: var(--card);
            border: 1px solid var(--line);
            animation: rise .35s ease both;
            animation-delay: calc(var(--i, 0) * 25ms);
        }

        .img-card img {
            display: block;
            width: 100%;
            height: auto;
            min-height: 60px;
            background: #121830;
        }

        .img-card:hover { border-color: var(--accent); }

        .img-cap { padding: 8px 10px 10px; font-size: 12px; line-height: 1.4; }
        .img-cap a { color: var(--title); text-decoration: none; display: block; }
        .img-cap a:hover { color: #fff; }
        .img-cap .host { color: var(--domain); opacity: .85; margin-top: 2px; }
        .img-cap .full { color: var(--muted); margin-top: 4px; }

        /* ---------- Vídeos ---------- */

        .video-list { max-width: 880px; }

        .video {
            display: flex;
            gap: 16px;
            padding: 12px 14px;
            margin: 0 -14px 4px;
            border-radius: 14px;
            border: 1px solid transparent;
            animation: rise .35s ease both;
            animation-delay: calc(var(--i, 0) * 35ms);
        }

        .video:hover { background: var(--card-hover); border-color: var(--line); }

        .thumb {
            position: relative;
            flex-shrink: 0;
            width: 240px;
            aspect-ratio: 16 / 9;
            border-radius: 12px;
            overflow: hidden;
            background: #121830;
            display: grid;
            place-items: center;
            color: var(--muted);
            font-size: 28px;
            text-decoration: none;
        }

        .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

        .thumb .play {
            position: absolute;
            right: 8px;
            bottom: 8px;
            padding: 2px 7px;
            border-radius: 6px;
            background: #000b;
            color: #fff;
            font-size: 12px;
        }

        .video-body { min-width: 0; }

        /* ---------- Notícias ---------- */

        .news-list { max-width: 820px; }

        .news {
            display: flex;
            gap: 18px;
            justify-content: space-between;
            padding: 16px 18px;
            margin: 0 -18px 4px;
            border-radius: 16px;
            border: 1px solid transparent;
            animation: rise .35s ease both;
            animation-delay: calc(var(--i, 0) * 35ms);
        }

        .news:hover { background: var(--card-hover); border-color: var(--line); }

        .news-body { min-width: 0; }

        .news-meta { font-size: 12px; color: var(--domain); opacity: .9; margin-bottom: 6px; }

        .news img {
            flex-shrink: 0;
            width: 140px;
            height: 94px;
            object-fit: cover;
            border-radius: 12px;
            background: #121830;
        }

        /* ---------- Maps ---------- */

        .maps {
            display: grid;
            grid-template-columns: minmax(280px, 380px) 1fr;
            gap: 18px;
            height: calc(100vh - 190px);
            min-height: 420px;
        }

        .places { overflow-y: auto; padding-right: 4px; }

        .place {
            display: block;
            width: 100%;
            text-align: left;
            padding: 14px 16px;
            margin-bottom: 8px;
            border-radius: 14px;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--text);
            font: inherit;
            cursor: pointer;
            transition: border-color .15s, background .15s;
        }

        .place:hover { background: var(--card-hover); }
        .place.active { border-color: var(--accent); background: var(--card-hover); }
        .place .pname { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
        .place .paddr { font-size: 12.5px; color: #a9afc6; line-height: 1.45; }
        .place .pcat { font-size: 11px; color: var(--domain); margin-top: 6px; text-transform: capitalize; }

        .map-frame {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--line);
            background: #121830;
        }

        .map-frame iframe { width: 100%; height: 100%; border: 0; }

        .map-open {
            position: absolute;
            right: 12px;
            top: 12px;
            padding: 7px 12px;
            border-radius: 10px;
            background: #0b0f1de6;
            border: 1px solid var(--line);
            color: var(--text);
            font-size: 12px;
            text-decoration: none;
        }

        .map-open:hover { border-color: var(--accent); }

        @media (max-width: 820px) {
            .maps { grid-template-columns: 1fr; height: auto; }
            .map-frame { height: 360px; }
            .video { flex-direction: column; }
            .thumb { width: 100%; }
            .news img { display: none; }
            .tabs { padding-left: 0; }
        }

    </style>
</head>


<body>

    <header class="topbar">
        <div class="topbar-inner">

            <a class="mark" href="saturnium://newtab" title="Nova aba">
                <span class="mark-dot">🪐</span>
                <span>Saturnium</span>
            </a>

            <form id="search-form" class="search-form">
                <span class="search-icon">⌕</span>
                <input
                    id="search-input"
                    type="text"
                    placeholder="Pesquisar na web..."
                    autocomplete="off"
                    spellcheck="false"
                >
                <span class="kbd">/</span>
                <button type="submit">Buscar</button>
            </form>

        </div>

        <nav id="tabs" class="tabs" aria-label="Tipo de resultado"></nav>
    </header>


    <main class="main">
        <div id="column" class="column">

            <div id="meta-line" class="meta-line"></div>

            <div id="state-box" class="state-box" style="display: none;"></div>

            <div id="results"></div>

            <div class="footer-note">
                Busca privada do SaturniumBrowser — sem perfil, sem rastreamento.
            </div>

        </div>
    </main>


    <script>

        const form = document.getElementById("search-form");
        const input = document.getElementById("search-input");
        const metaLine = document.getElementById("meta-line");
        const stateBox = document.getElementById("state-box");
        const resultsContainer = document.getElementById("results");
        const tabsNav = document.getElementById("tabs");
        const column = document.getElementById("column");

        const TABS = [
            { id: "all",    label: "Tudo",     icon: "⌕" },
            { id: "ai",     label: "Modo IA",  icon: "✦", ai: true },
            { id: "images", label: "Imagens",  icon: "▣" },
            { id: "videos", label: "Vídeos",   icon: "▶" },
            { id: "news",   label: "Notícias", icon: "☰" },
            { id: "maps",   label: "Maps",     icon: "⚲" }
        ];

        const PLACEHOLDERS = {
            all: "Pesquisar na web...",
            ai: "Pergunte ao Modo IA...",
            images: "Pesquisar imagens...",
            videos: "Pesquisar vídeos...",
            news: "Pesquisar notícias...",
            maps: "Pesquisar lugares..."
        };

        let currentTab = "all";
        let currentQuery = "";


        // Preenche a busca a partir da URL, se disponível
        try {
            const params = new URLSearchParams(window.location.search);
            input.value = params.get("q") || "";
        } catch (error) {}


        function searchUrl(q, tab) {

            return "saturnium://search?q=" + encodeURIComponent(q) +
                (tab && tab !== "all" ? "&tab=" + tab : "");

        }


        form.addEventListener("submit", (event) => {

            event.preventDefault();

            const value = input.value.trim();

            if (!value) return;

            window.location.href = searchUrl(value, currentTab);

        });


        // Atalho: "/" foca a barra de busca
        document.addEventListener("keydown", (event) => {

            if (
                event.key === "/" &&
                document.activeElement !== input &&
                !event.ctrlKey && !event.metaKey && !event.altKey
            ) {
                event.preventDefault();
                input.focus();
                input.select();
            }

        });


        // ---------- utilidades ----------

        function parseUrl(url) {

            try {
                const u = new URL(url);
                if (u.protocol !== "http:" && u.protocol !== "https:") return null;
                return u;
            } catch (error) {
                return null;
            }

        }

        function prettyPath(u) {

            const parts = u.pathname.split("/").filter(Boolean).map((p) => {
                try { return decodeURIComponent(p); } catch (e) { return p; }
            });

            return parts.length ? u.hostname.replace(/^www\./, "") + " › " + parts.join(" › ") : u.hostname.replace(/^www\./, "");

        }

        function isAd(u) {

            return /(^|\.)duckduckgo\.com$/i.test(u.hostname) && /^\/y\.js/i.test(u.pathname);

        }

        function el(tag, className, text) {

            const node = document.createElement(tag);

            if (className) node.className = className;
            if (text !== undefined) node.textContent = text;

            return node;

        }

        function link(className, text, url) {

            const a = el("a", className, text);

            a.href = url;

            return a;

        }

        function showState(message) {

            stateBox.style.display = "block";
            stateBox.textContent = message;

        }

        function hideState() {

            stateBox.style.display = "none";

        }

        function plural(n, one, many) {

            return `${n} ${n === 1 ? one : many}`;

        }

        function relativeDate(value) {

            const d = new Date(value);

            if (isNaN(d.getTime())) return "";

            const diff = Math.max(0, Date.now() - d.getTime());
            const min = Math.round(diff / 60000);

            if (min < 1) return "agora";
            if (min < 60) return `há ${min} min`;

            const h = Math.round(min / 60);

            if (h < 24) return `há ${h} h`;

            const days = Math.round(h / 24);

            if (days < 30) return `há ${days} ${days === 1 ? "dia" : "dias"}`;

            return d.toLocaleDateString("pt-BR");

        }

        function setupTab(tab, query) {

            currentTab = TABS.some((t) => t.id === tab) ? tab : "all";
            currentQuery = query || "";

            if (query && input.value !== query) input.value = query;

            input.placeholder = PLACEHOLDERS[currentTab];

            column.classList.toggle("wide", currentTab === "images" || currentTab === "maps");

            tabsNav.textContent = "";

            for (const t of TABS) {

                const a = el("a", "tab" + (t.ai ? " ai" : "") + (t.id === currentTab ? " active" : ""));

                a.href = currentQuery ? searchUrl(currentQuery, t.id) : "#";

                a.appendChild(el("span", t.ai ? "spark" : "", t.icon));
                a.appendChild(el("span", "", t.label));

                if (!currentQuery) {
                    a.addEventListener("click", (e) => { e.preventDefault(); input.focus(); });
                }

                tabsNav.appendChild(a);
            }

        }


        // ---------- carregando ----------

        const LOADING_TEXT = {
            all: "Buscando",
            ai: "Pensando na resposta para",
            images: "Buscando imagens de",
            videos: "Buscando vídeos de",
            news: "Buscando notícias sobre",
            maps: "Buscando lugares para"
        };

        window.renderSearchLoading = function (arg) {

            const data = typeof arg === "string" ? { query: arg, tab: "all" } : (arg || {});

            setupTab(data.tab, data.query);

            metaLine.textContent =
                data.query ? `${LOADING_TEXT[currentTab]} "${data.query}"...` : "";

            resultsContainer.innerHTML = "";
            hideState();

            const count = currentTab === "images" ? 0 : 4;

            for (let i = 0; i < count; i++) {

                const box = el("div", "skeleton");

                for (const width of ["35%", "70%", "100%", "85%"]) {
                    const line = el("div", "sk");
                    line.style.width = width;
                    box.appendChild(line);
                }

                resultsContainer.appendChild(box);

            }

        };


        // ---------- Tudo ----------

        function renderWeb(results, query) {

            let shown = 0;

            results.forEach((item, index) => {

                const u = parseUrl(item.url);

                if (!u) return;

                const host = u.hostname.replace(/^www\./, "");

                const entry = el("article", "result");
                entry.style.setProperty("--i", Math.min(index, 12));

                const head = el("div", "result-head");

                const fav = el("div", "favicon", host.charAt(0));
                const img = document.createElement("img");
                img.alt = "";
                img.referrerPolicy = "no-referrer";
                img.src = "https://icons.duckduckgo.com/ip3/" + encodeURIComponent(u.hostname) + ".ico";
                img.addEventListener("error", () => img.remove());
                fav.appendChild(img);

                const site = el("div", "site");
                site.appendChild(el("div", "site-name", host));
                site.appendChild(el("div", "site-path", isAd(u) ? "Link patrocinado" : prettyPath(u)));

                head.appendChild(fav);
                head.appendChild(site);

                if (isAd(u)) head.appendChild(el("span", "badge", "Patrocinado"));

                entry.appendChild(head);
                entry.appendChild(link("result-title", item.title || host, u.href));
                if (item.snippet) entry.appendChild(el("div", "result-snippet", item.snippet));

                resultsContainer.appendChild(entry);

                shown++;

            });

            metaLine.textContent = `${plural(shown, "resultado", "resultados")} para "${query}"`;

        }


        // ---------- Modo IA ----------

        // Markdown mínimo e seguro (parágrafos, listas, **negrito**, [n]).
        function appendInline(parent, text, sources) {

            const re = /(\*\*[^*]+\*\*|\[\d{1,2}\])/g;

            let last = 0;
            let m;

            while ((m = re.exec(text)) !== null) {

                if (m.index > last) parent.appendChild(document.createTextNode(text.slice(last, m.index)));

                const token = m[0];

                if (token.startsWith("**")) {

                    parent.appendChild(el("strong", "", token.slice(2, -2)));

                } else {

                    const n = Number(token.slice(1, -1));
                    const src = sources && sources[n - 1];
                    const u = src && parseUrl(src.url);

                    if (u) {
                        const a = link("cite", String(n), u.href);
                        a.title = src.title || u.hostname;
                        parent.appendChild(a);
                    } else {
                        parent.appendChild(document.createTextNode(token));
                    }
                }

                last = m.index + token.length;
            }

            if (last < text.length) parent.appendChild(document.createTextNode(text.slice(last)));

        }

        function renderAnswer(container, text, sources) {

            let list = null;

            for (const raw of String(text || "").split(/\r?\n/)) {

                const line = raw.trim();

                if (!line) { list = null; continue; }

                const bullet = /^(?:[-*•]|\d+[.)])\s+(.*)$/.exec(line);

                if (bullet) {

                    if (!list) { list = el("ul"); container.appendChild(list); }

                    const li = el("li");
                    appendInline(li, bullet[1], sources);
                    list.appendChild(li);

                } else {

                    list = null;

                    const p = el("p");
                    appendInline(p, line.replace(/^#+\s*/, ""), sources);
                    container.appendChild(p);
                }
            }

        }

        function renderSources(sources) {

            const valid = (sources || []).filter((s) => parseUrl(s.url));

            if (!valid.length) return;

            resultsContainer.appendChild(el("div", "sources-title", "Fontes"));

            valid.forEach((item, index) => {

                const u = parseUrl(item.url);

                const entry = el("article", "result");
                entry.style.setProperty("--i", index);
                entry.style.maxWidth = "820px";

                const head = el("div", "result-head");
                head.appendChild(el("div", "src-num", String(index + 1)));

                const site = el("div", "site");
                site.appendChild(el("div", "site-name", u.hostname.replace(/^www\./, "")));
                site.appendChild(el("div", "site-path", prettyPath(u)));
                head.appendChild(site);

                entry.appendChild(head);
                entry.appendChild(link("result-title", item.title || u.hostname, u.href));
                if (item.snippet) entry.appendChild(el("div", "result-snippet", item.snippet));

                resultsContainer.appendChild(entry);

            });

        }

        function renderAI(ai, sources, query) {

            const card = el("section", "ai-card");

            const label = el("div", "ai-label");
            label.appendChild(el("span", "spark", "✦"));
            label.appendChild(el("span", "", "Modo IA"));
            card.appendChild(label);

            const text = el("div", "ai-text");
            renderAnswer(text, ai.answer, sources);
            card.appendChild(text);

            const model = [ai.provider, ai.model].filter(Boolean).join(" · ");
            if (model) card.appendChild(el("div", "ai-model", `Gerado por ${model}. Confira as fontes.`));

            resultsContainer.appendChild(card);

            renderSources(sources);

            metaLine.textContent = `Resposta para "${query}"`;

        }


        // ---------- Imagens ----------

        function renderImages(items, query) {

            const grid = el("div", "img-grid");

            let shown = 0;

            items.forEach((item, index) => {

                const page = parseUrl(item.url);
                const thumb = parseUrl(item.thumb);

                if (!page || !thumb) return;

                const card = el("figure", "img-card");
                card.style.setProperty("--i", Math.min(index, 20));

                const img = document.createElement("img");
                img.loading = "lazy";
                img.alt = item.title || "";
                img.referrerPolicy = "no-referrer";
                img.src = thumb.href;
                img.addEventListener("error", () => card.remove());

                const a = el("a");
                a.href = page.href;
                a.appendChild(img);
                card.appendChild(a);

                const cap = el("figcaption", "img-cap");
                if (item.title) cap.appendChild(link("", item.title, page.href));
                cap.appendChild(el("div", "host", page.hostname.replace(/^www\./, "")));

                const full = parseUrl(item.full);
                if (full) cap.appendChild(link("full", "Abrir imagem original", full.href));

                card.appendChild(cap);
                grid.appendChild(card);

                shown++;

            });

            resultsContainer.appendChild(grid);

            metaLine.textContent = `${plural(shown, "imagem", "imagens")} para "${query}"`;

        }


        // ---------- Vídeos ----------

        function renderVideos(items, query) {

            const list = el("div", "video-list");

            let shown = 0;

            items.forEach((item, index) => {

                const u = parseUrl(item.url);

                if (!u) return;

                const row = el("article", "video");
                row.style.setProperty("--i", Math.min(index, 12));

                const thumb = el("a", "thumb");
                thumb.href = u.href;
                thumb.appendChild(el("span", "", "▶"));

                const tu = parseUrl(item.thumb);

                if (tu) {
                    const img = document.createElement("img");
                    img.alt = "";
                    img.loading = "lazy";
                    img.referrerPolicy = "no-referrer";
                    img.src = tu.href;
                    img.addEventListener("error", () => img.remove());
                    thumb.appendChild(img);
                }

                if (item.duration) thumb.appendChild(el("span", "play", item.duration));

                const body = el("div", "video-body");
                body.appendChild(link("result-title", item.title || u.hostname, u.href));
                body.appendChild(el("div", "site-path", (item.source || u.hostname.replace(/^www\./, ""))));
                if (item.snippet) body.appendChild(el("div", "result-snippet", item.snippet));

                row.appendChild(thumb);
                row.appendChild(body);
                list.appendChild(row);

                shown++;

            });

            resultsContainer.appendChild(list);

            metaLine.textContent = `${plural(shown, "vídeo", "vídeos")} para "${query}"`;

        }


        // ---------- Notícias ----------

        function renderNews(items, query) {

            const list = el("div", "news-list");

            let shown = 0;

            items.forEach((item, index) => {

                const u = parseUrl(item.url);

                if (!u) return;

                const row = el("article", "news");
                row.style.setProperty("--i", Math.min(index, 12));

                const body = el("div", "news-body");

                const meta = [item.source, relativeDate(item.date)].filter(Boolean).join(" · ");
                body.appendChild(el("div", "news-meta", meta));
                body.appendChild(link("result-title", item.title || u.hostname, u.href));
                if (item.snippet) body.appendChild(el("div", "result-snippet", item.snippet));

                row.appendChild(body);

                const iu = parseUrl(item.image);

                if (iu) {
                    const img = document.createElement("img");
                    img.alt = "";
                    img.loading = "lazy";
                    img.referrerPolicy = "no-referrer";
                    img.src = iu.href;
                    img.addEventListener("error", () => img.remove());
                    row.appendChild(img);
                }

                list.appendChild(row);

                shown++;

            });

            resultsContainer.appendChild(list);

            metaLine.textContent = `${plural(shown, "notícia", "notícias")} sobre "${query}"`;

        }


        // ---------- Maps ----------

        function osmEmbed(place) {

            const d = 0.012;

            const bbox = place.bbox && place.bbox.length === 4
                ? place.bbox
                : [place.lon - d, place.lat - d, place.lon + d, place.lat + d];

            return "https://www.openstreetmap.org/export/embed.html?bbox=" +
                bbox.map((n) => Number(n).toFixed(6)).join("%2C") +
                "&layer=mapnik&marker=" + place.lat.toFixed(6) + "%2C" + place.lon.toFixed(6);

        }

        function renderMaps(places, query) {

            const wrap = el("div", "maps");
            const listBox = el("div", "places");
            const mapBox = el("div", "map-frame");

            const frame = document.createElement("iframe");
            frame.title = "Mapa";
            frame.referrerPolicy = "no-referrer";
            frame.loading = "lazy";

            const open = el("a", "map-open", "Abrir no OpenStreetMap ↗");
            open.target = "_blank";

            mapBox.appendChild(frame);
            mapBox.appendChild(open);

            const buttons = [];

            function select(i) {

                const p = places[i];

                frame.src = osmEmbed(p);
                open.href = `https://www.openstreetmap.org/?mlat=${p.lat}&mlon=${p.lon}#map=16/${p.lat}/${p.lon}`;

                buttons.forEach((b, j) => b.classList.toggle("active", i === j));

            }

            places.forEach((p, i) => {

                const b = el("button", "place");
                b.type = "button";
                b.appendChild(el("div", "pname", p.name));
                b.appendChild(el("div", "paddr", p.address));
                if (p.category) b.appendChild(el("div", "pcat", String(p.category).replace(/_/g, " ")));
                b.addEventListener("click", () => select(i));

                buttons.push(b);
                listBox.appendChild(b);

            });

            wrap.appendChild(listBox);
            wrap.appendChild(mapBox);
            resultsContainer.appendChild(wrap);

            select(0);

            metaLine.textContent = `${plural(places.length, "lugar", "lugares")} para "${query}"`;

        }


        // ==========================================
        // ESTADO: RESULTADOS PRONTOS
        // ==========================================

        window.renderSearchResults = function (data) {

            const { query, tab, results, ai, sources, error } = data || {};

            setupTab(tab, query);

            resultsContainer.innerHTML = "";

            if (!query) {
                metaLine.textContent = "";
                showState("Digite algo para buscar.");
                return;
            }

            if (error) {

                metaLine.textContent = `Busca por "${query}"`;
                showState(error);

                // No Modo IA, ainda mostra as fontes encontradas.
                if (currentTab === "ai" && sources && sources.length) {
                    renderSources(sources);
                }

                return;
            }

            if (currentTab === "ai") {

                if (!ai || !ai.answer) {
                    metaLine.textContent = `Busca por "${query}"`;
                    showState("O Modo IA não retornou resposta.");
                    return;
                }

                hideState();
                renderAI(ai, sources || ai.sources, query);
                return;
            }

            if (!results || results.length === 0) {
                metaLine.textContent = `Busca por "${query}"`;
                showState("Nenhum resultado encontrado.");
                return;
            }

            hideState();

            switch (currentTab) {
                case "images": renderImages(results, query); break;
                case "videos": renderVideos(results, query); break;
                case "news":   renderNews(results, query);   break;
                case "maps":   renderMaps(results, query);   break;
                default:       renderWeb(results, query);
            }

        };


        setupTab("all", input.value);

        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);

    </script>
