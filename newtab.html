<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nova aba - VoidBrowser</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            font-family: Arial, sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at 50% 35%,
                    #151b35 0%,
                    #090c18 35%,
                    #05060b 70%
                );
        }


        .container {
            width: 100%;
            height: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            padding-bottom: 80px;
        }


        .logo {
            width: 90px;
            height: 90px;

            object-fit: contain;

            margin-bottom: 18px;

            filter:
                drop-shadow(0 0 15px rgba(80, 100, 255, 0.35));
        }


        h1 {
            margin: 0;

            font-size: 42px;

            letter-spacing: 3px;

            background:
                linear-gradient(
                    90deg,
                    #6f7cff,
                    #9b5cff,
                    #d45cff
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }


        .subtitle {
            margin-top: 10px;

            color: #7d849c;

            font-size: 14px;
        }


        .search-box {
            width: min(650px, 80%);

            height: 55px;

            margin-top: 35px;

            display: flex;

            align-items: center;

            padding: 0 20px;

            border-radius: 30px;

            background: #111525;

            border: 1px solid #252b45;

            box-shadow:
                0 0 30px rgba(70, 80, 180, 0.12);

            transition: 0.2s;
        }


        .search-box:focus-within {
            border-color: #695cff;

            box-shadow:
                0 0 30px rgba(105, 92, 255, 0.25);
        }


        .search-icon {
            font-size: 20px;

            margin-right: 12px;

            color: #777fff;
        }


        #search {
            width: 100%;

            height: 100%;

            border: none;

            outline: none;

            background: transparent;

            color: white;

            font-size: 15px;
        }


        #search::placeholder {
            color: #656b80;
        }


        .shortcuts {
            display: flex;

            gap: 12px;

            margin-top: 25px;
        }


        .shortcut {
            padding: 10px 15px;

            border-radius: 10px;

            background: #101423;

            border: 1px solid #20263c;

            color: #7e859b;

            font-size: 12px;
        }


        .footer {
            position: absolute;

            bottom: 20px;

            color: #4e556b;

            font-size: 11px;
        }

    </style>
</head>


<body>

    <div class="container">

        <img
            class="logo"
            src="assets/voidbrowser-icon.png"
            alt="VoidBrowser"
        >

        <h1>VoidBrowser</h1>

        <div class="subtitle">
            Navegue além do comum.
        </div>


        <div class="search-box">

            <span class="search-icon">⌕</span>

            <input
                id="search"
                type="text"
                placeholder="Pesquisar na web ou digitar um endereço..."
                autofocus
            >

        </div>


        <div class="shortcuts">

            <div class="shortcut">
                Ctrl + L — Barra de endereço
            </div>

            <div class="shortcut">
                Ctrl + T — Nova aba
            </div>

            <div class="shortcut">
                Ctrl + H — Histórico
            </div>

        </div>


        <div class="footer">
            VoidBrowser • Seu navegador, seu espaço.
        </div>

    </div>


    <script>

        const search = document.getElementById("search");


        search.addEventListener("keydown", (event) => {

            if (event.key !== "Enter") {
                return;
            }


            const value = search.value.trim();

            if (!value) {
                return;
            }


            if (
                /^https?:\/\//i.test(value) ||
                /^[\w.-]+\.[a-z]{2,}/i.test(value)
            ) {

                let url = value;

                if (!/^https?:\/\//i.test(url)) {
                    url = "https://" + url;
                }

                location.href = url;

            } else {

                location.href =
                    "void://search?q=" +
                    encodeURIComponent(value);

            }

        });

    </script>

</body>

</html>
