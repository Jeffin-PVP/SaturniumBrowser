<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SaturniumBrowser</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="browser">

        <header class="topbar">

            <div class="brand">
                <img src="assets/saturniumbrowser-icon.png" alt="SaturniumBrowser">
                <span>SaturniumBrowser</span>
            </div>

            <div class="window-buttons">

                <button id="minimize-window" title="Minimizar">
                    −
                </button>

                <button id="maximize-window" title="Maximizar">
                    □
                </button>

                <button id="close-window" title="Fechar">
                    ×
                </button>

            </div>

        </header>

        <!-- BARRA DE ABAS -->
        <div class="tabs-bar">

            <div id="tabs"></div>

            <button id="new-tab" class="new-tab" title="Nova aba">
                +
            </button>

        </div>

        <!-- BARRA DE NAVEGAÇÃO -->
        <nav class="toolbar">

            <button id="back">←</button>

            <button id="forward">→</button>

            <button id="reload">⟳</button>

            <div class="url-bar-wrapper">

                <span
                    id="security-indicator"
                    class="security-indicator"
                ></span>

                <input id="url" type="text" placeholder="Pesquisar ou digitar endereço...">

            </div>

            <button id="menu" type="button">⋮</button>

        </nav>

        <main class="content">

            <h1>Bem-vindo ao SaturniumBrowser</h1>

            <p>
                Nosso navegador está começando.
            </p>

        </main>

        <!-- BARRA DE DOWNLOADS -->
        <div id="downloads-bar" class="downloads-bar">

            <div id="downloads-bar-list" class="downloads-bar-list"></div>

            <div class="downloads-bar-actions">

                <button id="downloads-bar-open-all" type="button">
                    Ver todos
                </button>

                <button id="downloads-bar-close" type="button" title="Fechar">
                    ×
                </button>

            </div>

        </div>

    </div>


    <script src="browser.js"></script>
</body>

</html>
